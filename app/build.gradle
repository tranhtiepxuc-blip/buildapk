apply plugin: 'com.android.application'

android {
    namespace 'com.duc.vcam'
    compileSdk 34

    defaultConfig {
        applicationId "com.duc.vcam"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// Nạp độc lập thư viện API Xposed cho riêng luồng biên dịch class của app
dependencies {
    // Ép Gradle nạp trực tiếp file jar từ kho trung tâm mà không cần phân giải qua classpath hệ thống
    compileOnly 'de.robv.android.xposed:api:82'
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
