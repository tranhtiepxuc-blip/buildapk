name: Build VCam APK Module

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 🚀 TUYỆT CHIÊU QUYẾT ĐỊNH: Ép máy ảo cài đặt thẳng Gradle bản 8.5 để triệt tiêu lỗi của bản 9.5
    - name: Setup Gradle 8.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.5

    - name: Compile and Build Release APK
      run: gradle :app:assembleRelease

    - name: Collect Finished APK
      run: |
        mkdir -p Output
        cp app/build/outputs/apk/release/*.apk Output/Omni_VCam_Xposed.apk || cp app/build/outputs/apk/release/app-release-unsigned.apk Output/Omni_VCam_Xposed.apk
        echo "🟢 Biên dịch thành công! File APK đã nằm trong thư mục Output."

    - name: Upload Finished APK to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Omni-VCam-Module-APK
        path: Output/Omni_VCam_Xposed.apk
