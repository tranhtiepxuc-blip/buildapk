name: Build Omni VCam Pro APK

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 🚀 CHIÊU ĐỘC: Tự tạo cấu trúc lớp Xposed giả lập ngay trên máy ảo để javac nhận diện, KHÔNG CẦN TẢI MẠNG!
    - name: Create Xposed Stubs
      run: |
        mkdir -p stubs/de/robv/android/xposed/callbacks/XC_LoadPackage
        
        # 1. Tạo file XC_MethodHook giả lập
        cat << 'EOF' > stubs/de/robv/android/xposed/XC_MethodHook.java
        package de.robv.android.xposed;
        public abstract class XC_MethodHook {
            protected void beforeHookedMethod(MethodHookParam param) throws Throwable {}
            protected void afterHookedMethod(MethodHookParam param) throws Throwable {}
            public static class MethodHookParam {
                public Object[] args;
                public Object getResult() { return null; }
            }
        }
        EOF

        # 2. Tạo file IXposedHookLoadPackage giả lập
        cat << 'EOF' > stubs/de/robv/android/xposed/IXposedHookLoadPackage.java
        package de.robv.android.xposed;
        import de.robv.android.xposed.callbacks.XC_LoadPackage.LoadPackageParam;
        public interface IXposedHookLoadPackage {
            void handleLoadPackage(LoadPackageParam lpparam) throws Throwable;
        }
        EOF

        # 3. Tạo file XposedBridge giả lập
        cat << 'EOF' > stubs/de/robv/android/xposed/XposedBridge.java
        package de.robv.android.xposed;
        public class XposedBridge {
            public static void log(String text) {}
            public static void log(Throwable t) {}
        }
        EOF

        # 4. Tạo file XposedHelpers giả lập
        cat << 'EOF' > stubs/de/robv/android/xposed/XposedHelpers.java
        package de.robv.android.xposed;
        public class XposedHelpers {
            public static Object findAndHookMethod(Class<?> clazz, String methodName, Object... parameterTypesAndCallback) { return null; }
            public static Object findAndHookMethod(String className, ClassLoader classLoader, String methodName, Object... parameterTypesAndCallback) { return null; }
        }
        EOF

        # 5. Tạo file LoadPackageParam giả lập
        cat << 'EOF' > stubs/de/robv/android/xposed/callbacks/XC_LoadPackage/LoadPackageParam.java
        package de.robv.android.xposed.callbacks.XC_LoadPackage;
        public class LoadPackageParam {
            public String packageName;
            public ClassLoader classLoader;
        }
        EOF

    # 🔨 BƯỚC 1: Biên dịch chung file code của Đức phối hợp với cấu trúc mồi vừa tạo
    - name: Compile Java Source to Class
      run: |
        mkdir -p obj
        ANDROID_JAR=$(find $ANDROID_HOME/platforms/ -name "android.jar" | sort -V | tail -n 1)
        echo "🟢 Sử dụng Android SDK Platform: $ANDROID_JAR"
        
        # Dịch song song cả file chính và file mồi để javac thông suốt liên kết cấu trúc
        javac -target 1.8 -source 1.8 \
          -bootclasspath "$ANDROID_JAR" \
          -d obj \
          stubs/de/robv/android/xposed/XC_MethodHook.java \
          stubs/de/robv/android/xposed/IXposedHookLoadPackage.java \
          stubs/de/robv/android/xposed/XposedBridge.java \
          stubs/de/robv/android/xposed/XposedHelpers.java \
          stubs/de/robv/android/xposed/callbacks/XC_LoadPackage/LoadPackageParam.java \
          src/com/duc/vcam/XposedHook.java \
          src/com/duc/vcam/MainActivity.java

    # 🔨 BƯỚC 2: Ép duy nhất toàn bộ class của RIÊNG ĐỨC thành classes.dex (Thanh lọc sạch sẽ file mồi)
    - name: Convert Class to Android Dex
      run: |
        mkdir -p dex_out
        D8_PATH=$(find $ANDROID_HOME/build-tools/ -name "d8" | sort -V | tail -n 1)
        echo "🟢 Sử dụng công cụ D8: $D8_PATH"
        
        # Chỉ quét và ép dịch đúng thư mục com/duc/vcam của bạn, loại bỏ hoàn toàn đống stubs
        find obj/com/duc/vcam -name "*.class" > app_classes.txt
        $D8_PATH --release --output dex_out @app_classes.txt

    # 🔨 BƯỚC 3: Đóng gói và ký chứng chỉ APK
    - name: Package and Sign APK
      run: |
        mkdir -p Output
        AAPT2_PATH=$(find $ANDROID_HOME/build-tools/ -name "aapt2" | sort -V | tail -n 1)
        ANDROID_JAR=$(find $ANDROID_HOME/platforms/ -name "android.jar" | sort -V | tail -n 1)
        
        $AAPT2_PATH link -o Output/base.apk -I "$ANDROID_JAR" --manifest AndroidManifest.xml --target-sdk-version 34
        
        cd dex_out && zip -g ../Output/base.apk classes.dex && cd ..
        
        mkdir -p assets && echo "com.duc.vcam.XposedHook" > assets/xposed_init
        zip -g Output/base.apk assets/xposed_init

        keytool -genkeypair -v -keystore key.p12 -alias alias -keyalg RSA -keysize 2048 -validity 10000 -storetype PKCS12 -storepass duc123456 -keypass duc123456 -dname "CN=duc"
        APKSIGNER_PATH=$(find $ANDROID_HOME/build-tools/ -name "apksigner" | sort -V | tail -n 1)
        $APKSIGNER_PATH sign --ks key.p12 --ks-pass pass:duc123456 Output/base.apk
        
        mv Output/base.apk Output/Omni_VCam_Pro.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Omni-VCam-Pro-APK
        path: Output/Omni_VCam_Pro.apk
