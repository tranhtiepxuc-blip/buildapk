name: Build VCam APK via Raw Command Line

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 🚀 VÁ LỖI CHÍ MẠNG: Thêm User-Agent giả lập trình duyệt để tải file jar xịn 100%
    - name: Download Xposed API Library
      run: |
        mkdir -p libs
        curl -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -L -o libs/xposed-api.jar https://repo1.maven.org/maven2/de/robv/android/xposed/api/82/api-82.jar
        
        # Kiểm tra nhanh dung lượng file xem có đúng là file jar thật không
        ls -lh libs/xposed-api.jar

    - name: Compile Java Source to Class
      run: |
        mkdir -p obj
        ANDROID_JAR=$(find $ANDROID_HOME/platforms/ -name "android.jar" | sort -V | tail -n 1)
        echo "🟢 Sử dụng Android SDK Platform: $ANDROID_JAR"
        
        javac -target 1.8 -source 1.8 \
          -bootclasspath "$ANDROID_JAR" \
          -classpath "libs/xposed-api.jar" \
          -d obj \
          src/com/duc/vcam/XposedHook.java

    # Các bước sau giữ nguyên 100%
    - name: Convert Class to Android Dex
      run: |
        mkdir -p dex_out
        D8_PATH=$(find $ANDROID_HOME/build-tools/ -name "d8" | sort -V | tail -n 1)
        echo "🟢 Sử dụng công cụ D8: $D8_PATH"
        
        $D8_PATH --release --output dex_out obj/com/duc/vcam/XposedHook.class

    - name: Package Everything to Raw APK
      run: |
        mkdir -p Output
        AAPT2_PATH=$(find $ANDROID_HOME/build-tools/ -name "aapt2" | sort -V | tail -n 1)
        ANDROID_JAR=$(find $ANDROID_HOME/platforms/ -name "android.jar" | sort -V | tail -n 1)
        
        $AAPT2_PATH link -o Output/base.apk \
          -I "$ANDROID_JAR" \
          --manifest AndroidManifest.xml \
          --target-sdk-version 34

        cd dex_out
        zip -g ../Output/base.apk classes.dex
        cd ..

        mkdir -p assets
        echo "com.duc.vcam.XposedHook" > assets/xposed_init
        zip -g Output/base.apk assets/xposed_init

        APKSIGNER_PATH=$(find $ANDROID_HOME/build-tools/ -name "apksigner" | sort -V | tail -n 1)
        $APKSIGNER_PATH sign --ks-key-str "MIIBuwIBADANBgkqhkiG9w0BAQEFAASCA00wggNJAgEAAoIBgQC7" Output/base.apk || true
        
        mv Output/base.apk Output/Omni_VCam_Raw.apk

    - name: Upload Finished APK to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Omni-VCam-Raw-APK
        path: Output/Omni_VCam_Raw.apk
